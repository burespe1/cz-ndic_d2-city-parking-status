cs:
  perex: 'Tento dokument popisuje datový formát, používaný pro poskytování informací o aktuální obsazenosti městských parkovišť a parkovišť P+R: míry obsazenosti a stavu parkoviště (volno, téměř plno, plno). Formát nese jen proměnné údaje; popis parkovišť (název, poloha, kapacita, provozovatel) poskytuje statický formát cz-ndic_d2-city-parking-table, na jehož tabulku se zprávy odkazují. Formát vychází z publikace ParkingStatusPublication modelu DATEX II 3.7 a je lehkou podmnožinou profilu pro parkoviště nákladních vozidel (ITP).'
  keywords: DATEX II, NDIC, ParkingStatusPublication
en:
  perex: 'This document describes the data format used to provide information about the current occupancy of urban car parks and park-and-ride sites: the occupancy rate and the status of the car park (spaces available, almost full, full). The format carries only variable data; the description of car parks (name, location, capacity, operator) is provided by the static format cz-ndic_d2-city-parking-table, whose table the messages reference. The format is based on the ParkingStatusPublication of the DATEX II 3.7 model and is a light subset of the profile for truck parking (ITP).'
  keywords: DATEX II, NDIC, ParkingStatusPublication
